# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/workspaces.conf


###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = ~/.config/wm-common/launch-terminal.sh
$fileManager = nemo
$menu = fuzzel
$browser = ~/.config/wm-common/launch-chrome.sh


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
exec-once = ~/.config/waybar/start-waybar.sh
exec-once = wl-paste --watch cliphist store
exec-once = ~/.config/wm-common/idle.sh
exec-once = mako
exec-once = ags run
# Re-apply the last-picked rice theme so first boot matches it (wallpaper, kitty, eww, etc.)
exec-once = ~/.config/rice/apply-theme.sh "$(readlink -f ~/.config/rice/current)"

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24


#####################
### LOOK AND FEEL ###
#####################

xwayland {
  force_zero_scaling = true 
}

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 3
    gaps_out = 5

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    #col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    #col.inactive_border = rgba(595959aa)
    col.active_border = rgba(A7C080ee)
    col.inactive_border = 0

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 10

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# Rice theme overrides (gaps/border/rounding/accent). Generated by apply-theme.sh.
# Placed after general{} and decoration{} so it wins, and survives `hyprctl reload`.
source = ~/.config/hypr/theme.conf

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    #enabled = yes, please :)
    enabled = false

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

# Smart gaps - no gaps when only one window
workspace = w[t1], gapsout:0, gapsin:0
workspace = w[tg1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrule = match:float false, match:workspace w[t1], border_size 0, rounding 0
windowrule = match:float false, match:workspace w[tg1], border_size 0, rounding 0
windowrule = match:float false, match:workspace f[1], border_size 0, rounding 0

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = false # You probably want this
    smart_split = true
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

cursor {
	no_hardware_cursors = true
}

###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets Windows key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Q, exec, $terminal 
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = ALT, SPACE, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
#bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, fullscreen, 1

# Move focus with mainMod + arrow keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod CTRL ALT  SHIFT, 0, movecurrentworkspacetomonitor, 0
bind = $mainMod CTRL ALT  SHIFT, 1, movecurrentworkspacetomonitor, 1
bind = $mainMod CTRL ALT  SHIFT, 2, movecurrentworkspacetomonitor, 2

bind = SUPER, I, exec, hints

# Special workspace moved to Mod+grave (see above)

# screenshot
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp -d)" - | wl-copy

# Clipboard history
bind = $mainMod SHIFT, V, exec, ~/.config/wm-common/clipboard.sh

# Color picker
bind = $mainMod SHIFT, P, exec, ~/.config/wm-common/color-picker.sh

# Calculator
bind = $mainMod, equal, exec, ~/.config/wm-common/calculator.sh

# Control center (eww) - Mod+A toggles, click outside closes
bind = $mainMod, A, exec, ~/.config/wm-common/toggle-control-center.sh

# Theme switcher
bind = $mainMod SHIFT, T, exec, ~/.config/rice/pick-theme.sh

# Scratchpad (dropdown terminal) - toggle with Mod+grave (backtick)
bind = $mainMod, grave, togglespecialworkspace, scratchpad
bind = $mainMod SHIFT, grave, movetoworkspacesilent, special:scratchpad

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bind = ,XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = ,XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bindel = ,XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# Auto-assign apps to workspaces
# Discord & Beeper → workspace 1
windowrule = match:class ^(discord)$, workspace 1 silent
windowrule = match:class ^(Discord)$, workspace 1 silent
windowrule = match:class ^(beeper)$, workspace 1 silent
windowrule = match:class ^(Beeper)$, workspace 1 silent

# Obsidian → workspace 2
windowrule = match:class ^(obsidian)$, workspace 2 silent
windowrule = match:class ^(Obsidian)$, workspace 2 silent

# Spotify → workspace 3
windowrule = match:class ^(Spotify)$, workspace 3 silent
windowrule = match:class ^(spotify)$, workspace 3 silent
windowrule = match:title ^(Spotify)$, workspace 3 silent

# Chrome is handled by the smart launcher script (~/.config/wm-common/launch-chrome.sh)
# Terminal is handled by the smart launcher script (~/.config/wm-common/launch-terminal.sh)

# Float pavucontrol
windowrule = match:class ^(pavucontrol)$, float true

# Eww widgets - always float, no border, pinned
windowrule = match:class ^(eww)$, float true
windowrule = match:class ^(eww)$, no_anim on
windowrule = match:class ^(eww)$, border_size 0
windowrule = match:class ^(eww)$, no_shadow on
windowrule = match:title ^(eww), float true
windowrule = match:title ^(eww), no_anim on
windowrule = match:title ^(eww), border_size 0

# Ignore maximize requests from apps
windowrule = match:class .*, suppress_event maximize

# Fix some dragging issues with XWayland
windowrule = match:class ^$, match:title ^$, match:xwayland true, match:float true, match:fullscreen false, match:pin false, no_focus true

# Tell the compositor to inhibit idle while any window is fullscreen (video, presentations).
# swayidle respects this; windowed playback still depends on the app requesting inhibit.
windowrule = idle_inhibit fullscreen, match:fullscreen true

# Optional: inhibit auto-lock while Discord/Beeper are focused (calls). Remove if you want lock
# even with chat focused in the background.
# windowrule = idle_inhibit focus, match:class ^([dD]iscord|[bB]eeper)$
