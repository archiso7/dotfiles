# Where to search for projects (adjust paths to match your setup)
TS_SEARCH_PATHS=(~/Documents/Code/ ~/Documents/GitHub/ ~/src/github.com ~/world/trees/root/src/areas)

# If you have additional locations, add them here with optional depth
TS_EXTRA_SEARCH_PATHS=(~/.config:3 ~/:1)

# How deep to search in directories
TS_MAX_DEPTH=2

# Optional: Enable logging for debugging
# TS_LOG=true
