# Copy mode: vi keys, platform-appropriate clipboard.

setw -g mode-keys vi

# The clipboard binary differs per platform. copy-command is set once here and
# every copy binding below pipes through it, so nothing else needs to branch.
if-shell 'uname | grep -q Darwin' \
  "set -s copy-command 'pbcopy'" \
  "if-shell 'test -n \"$WAYLAND_DISPLAY\" && command -v wl-copy' \
     \"set -s copy-command 'wl-copy'\" \
     \"if-shell 'command -v xclip' \
        \\\"set -s copy-command 'xclip -selection clipboard'\\\" \
        \\\"set -s copy-command 'cat'\\\"\""

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi C-v send -X rectangle-toggle

bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel
bind-key -T copy-mode-vi Y send -X copy-pipe-end-of-line-and-cancel
bind-key -T copy-mode-vi Escape send -X cancel

# Keep the selection after copying with Enter, which is occasionally useful.
bind-key -T copy-mode-vi Enter send -X copy-pipe

# Drag-select with the mouse copies to the system clipboard too.
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel

# Enter copy mode and start searching backwards in one keystroke.
bind-key / copy-mode \; send-key ?
bind-key [ copy-mode
bind-key ] paste-buffer -p
