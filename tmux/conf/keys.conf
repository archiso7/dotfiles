# Prefix, windows, panes, sessions.
#
# Directional pane movement lives in navigation.conf because it is shared with
# neovim. Copy mode lives in copy.conf.

unbind C-b
set -g prefix C-Space
bind-key C-Space send-prefix

# Reload without restarting the server.
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# --- Splits ------------------------------------------------------------------
# | and - are mnemonic for the resulting split orientation, and both inherit
# the current pane's directory (tmux's defaults do not).
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

bind-key z resize-pane -Z
bind-key x kill-pane
bind-key X kill-window
bind-key Space next-layout
bind-key e select-layout -E   # spread panes evenly

# --- Windows -----------------------------------------------------------------
bind-key -r C-n next-window
bind-key -r C-p previous-window
bind-key Tab last-window
bind-key , command-prompt -I "#W" "rename-window '%%'"
bind-key . command-prompt "move-window -t '%%'"

# Swap the current window left/right.
bind-key -r "<" swap-window -d -t -1
bind-key -r ">" swap-window -d -t +1

# --- Sessions ----------------------------------------------------------------
bind-key f run-shell "tmux neww tmux-sessionizer"
bind-key s choose-tree -Zs
bind-key '$' command-prompt -I "#S" "rename-session '%%'"
bind-key d detach-client

# --- Popups ------------------------------------------------------------------
bind-key g display-popup -E -w 90% -h 90% "lazygit"
bind-key t display-popup -E -w 70% -h 70% -d "#{pane_current_path}" "$SHELL"
