# Directional movement shared with neovim.
#
# C-hjkl and M-hjkl are bound in the ROOT table (no prefix). The is_vim guard
# checks what is running in the target pane: if it is neovim, the key is
# forwarded and smart-splits.nvim handles it; otherwise tmux moves the pane.
# This is what makes a single keystroke cross the nvim/tmux boundary.
#
# Matching side: nvim/lua/plugins/navigation.lua.
#
# Tradeoff: with C-h bound at the root table, literally typing Ctrl-H in a
# shell pane moves panes rather than deleting a word. Real Backspace is
# unaffected because terminals send ^? (DEL), not ^H.

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

bind-key -n 'M-h' if-shell "$is_vim" 'send-keys M-h' 'resize-pane -L 3'
bind-key -n 'M-j' if-shell "$is_vim" 'send-keys M-j' 'resize-pane -D 3'
bind-key -n 'M-k' if-shell "$is_vim" 'send-keys M-k' 'resize-pane -U 3'
bind-key -n 'M-l' if-shell "$is_vim" 'send-keys M-l' 'resize-pane -R 3'

# Inside copy mode there is no shell to inspect, so move panes directly.
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# Prefix hjkl/HJKL still works, for when a root binding is being swallowed.
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind-key -r H resize-pane -L 3
bind-key -r J resize-pane -D 3
bind-key -r K resize-pane -U 3
bind-key -r L resize-pane -R 3
