# Core behaviour.

set -g default-terminal "tmux-256color"
# Truecolour for any outer terminal that advertises it.
set -ga terminal-overrides ",*256col*:Tc,alacritty:Tc,kitty:Tc,xterm-ghostty:Tc"

# Undercurl and coloured underlines, used by LSP diagnostics in neovim.
set -ga terminal-overrides ",*:Smulx=\\E[4::%p1%dm"
set -ga terminal-overrides ",*:Setulc=\\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m"

# Let neovim distinguish C-i from Tab, C-m from Enter, and see modified keys.
set -g extended-keys on
set -g extended-keys-format csi-u

# 0 is at the far end of the keyboard.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g mouse on
set -g history-limit 50000

# Time nvim's own escape handling depends on; 500ms default makes <Esc> laggy.
set -sg escape-time 10
set -g focus-events on
set -g display-time 2000
set -g display-panes-time 2000

set -g set-titles on
set -g set-titles-string "#S / #W"

setw -g automatic-rename on
setw -g monitor-activity on
set -g visual-activity off

# Open new panes and windows in the current directory.
set -g default-command "${SHELL}"
