# Statusline layout.
#
# Reads only @t_* user options, so swapping theme/*.conf (or letting the rice
# switcher generate theme.conf) restyles everything without editing this file.
#
# Layout:  [session][user]  1 nvim  2 shell        [date time][host]

set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify left

set -g status-style "fg=#{@t_fg},bg=#{@t_bg_dim}"
set -g mode-style "fg=#{@t_purple},bg=#{@t_bg_visual}"

# --- Windows -----------------------------------------------------------------
setw -g window-status-style "fg=#{@t_bg5},bg=#{@t_bg}"
setw -g window-status-activity-style "fg=#{@t_bg3},bg=#{@t_bg1}"
setw -g window-status-current-style "fg=#{@t_fg},bg=#{@t_bg_green}"
setw -g window-status-bell-style "fg=#{@t_bg},bg=#{@t_error}"

set -g window-status-separator "#[fg=#{@t_grey2},bg=#{@t_bg}] "
set -g window-status-format "#[fg=#{@t_inactive},bg=#{@t_bg}] #I  #W#{?window_zoomed_flag, ,} "
set -g window-status-current-format "#[fg=#{@t_bg},bg=#{@t_bg_green}]#[fg=#{@t_fg},bg=#{@t_bg_green}] #I  #[bold]#W#{?window_zoomed_flag, ,}#[nobold] #[fg=#{@t_bg_green},bg=#{@t_bg},nobold]"

# --- Panes -------------------------------------------------------------------
set -g pane-border-style "fg=#{@t_bg1}"
set -g pane-active-border-style "fg=#{@t_blue}"
set -g display-panes-active-colour "#{@t_blue}"
set -g display-panes-colour "#{@t_orange}"

# --- Messages ----------------------------------------------------------------
set -g message-style "fg=#{@t_error},bg=#{@t_bg_dim}"
set -g message-command-style "fg=#{@t_bg3},bg=#{@t_bg1}"

setw -g clock-mode-colour "#{@t_blue}"

# --- Left: session, user -----------------------------------------------------
set -g status-left-style none
set -g status-left-length 60
set -g status-left "#[fg=#{@t_bg_dim},bg=#{@t_accent},bold] #S #[fg=#{@t_accent},bg=#{@t_bg2},nobold]#[fg=#{@t_accent},bg=#{@t_bg2},bold] #(whoami) #[fg=#{@t_bg2},bg=#{@t_bg},nobold]"

# --- Right: prefix indicator, date, host -------------------------------------
set -g status-right-style none
set -g status-right-length 150
set -g status-right "#{?client_prefix,#[fg=#{@t_bg_dim}#,bg=#{@t_warn}#,bold] PREFIX #[default],}#[fg=#{@t_bg2}]#[fg=#{@t_fg},bg=#{@t_bg2}] %Y-%m-%d  %H:%M #[fg=#{@t_aqua},bg=#{@t_bg2},bold]#[fg=#{@t_bg_dim},bg=#{@t_aqua},bold] #h "
