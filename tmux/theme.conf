# Auto-generated by rice theme: Rivendell

# Colors
set -g @t_accent '#83C092'
set -g @t_bg '#151a1e'
set -g @t_bg2 '#273030'
set -g @t_bg3 '#2e3a38'
set -g @t_fg '#D3C6AA'
set -g @t_green '#83C092'
set -g @t_aqua '#7FBBB3'
set -g @t_red '#E06C75'
set -g @t_grey '#6B7A72'

set-option -g status "on"
set -g status-interval 2
set-option -g status-position top

# Statusbar
set-option -g status-style fg='#D3C6AA',bg='#151a1e'
set-option -g status-fg '#D3C6AA'
set-option -g status-bg '#151a1e'

# Mode
set-option -g mode-style fg='#83C092',bg='#273030'

# Windows
set-window-option -g window-status-style fg='#6B7A72',bg='#151a1e'
set-window-option -g window-status-activity-style bg='#273030',fg='#2e3a38'
set-window-option -g window-status-current-style fg='#D3C6AA',bg='#273030'

# Panes
set-option -g pane-border-style fg='#273030'
set-option -g pane-active-border-style fg='#83C092'

# Messages
set-option -g message-style fg='#E06C75',bg='#151a1e'
set-option -g message-command-style fg='#2e3a38',bg='#273030'

# Clock
set-window-option -g clock-mode-colour '#83C092'

# Bell
set-window-option -g window-status-bell-style fg='#151a1e',bg='#E06C75'

# Formatting — Powerline arrows with proper color transitions
set-option -g status-left-style none
set -g status-left-length 60
set -g status-left '#[fg=#151a1e,bg=#83C092,bold] #S #[fg=#83C092,bg=#2e3a38,nobold]#[fg=#83C092,bg=#2e3a38,bold] #(whoami) #[fg=#2e3a38,bg=#151a1e,nobold]'

set-option -g status-right-style none
set -g status-right-length 150
set -g status-right '#[fg=#2e3a38,bg=#151a1e]#[fg=#D3C6AA,bg=#2e3a38]  %Y-%m-%d  %H:%M #[fg=#7FBBB3,bg=#2e3a38,bold]#[fg=#151a1e,bg=#7FBBB3,bold] #h '

set -g window-status-separator '#[fg=#6B7A72,bg=#151a1e] '
set -g window-status-format "#[fg=#6B7A72,bg=#151a1e] #I  #W "
set -g window-status-current-format "#[fg=#151a1e,bg=#83C092]#[fg=#151a1e,bg=#83C092,bold] #I  #W #[fg=#83C092,bg=#151a1e,nobold]"
