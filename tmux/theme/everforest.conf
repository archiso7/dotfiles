# Everforest Dark (medium) palette.
#
# Exposed as @t_* user options rather than @everforest_* so that a theme
# generated by ~/.config/rice/apply-theme.sh uses the same names and can
# override this file wholesale. conf/status.conf only ever reads @t_*.

set -g @t_bg       '#2d353b'
set -g @t_bg_dim   '#232a2e'
set -g @t_bg1      '#343f44'
set -g @t_bg2      '#3d484d'
set -g @t_bg3      '#475258'
set -g @t_bg4      '#4f585e'
set -g @t_bg5      '#56635f'

set -g @t_bg_red    '#514045'
set -g @t_bg_green  '#425047'
set -g @t_bg_blue   '#3a515d'
set -g @t_bg_yellow '#4d4c43'
set -g @t_bg_visual '#543a48'

set -g @t_fg       '#d3c6aa'
set -g @t_red      '#e67e80'
set -g @t_orange   '#e69875'
set -g @t_yellow   '#dbbc7f'
set -g @t_green    '#a7c080'
set -g @t_aqua     '#83c092'
set -g @t_blue     '#7fbbb3'
set -g @t_purple   '#d699b6'

set -g @t_grey0    '#7a8478'
set -g @t_grey1    '#859289'
set -g @t_grey2    '#9da9a0'

# Semantic roles. status.conf uses these, so a new palette only has to define
# the roles rather than replicate the layout.
set -g @t_accent   '#a7c080'
set -g @t_warn     '#dbbc7f'
set -g @t_error    '#e67e80'
set -g @t_inactive '#7a8478'
