# Rivendell palette.
#
# Recovered from the tmux/theme.conf that ~/.config/rice/apply-theme.sh had
# generated on the Arch laptop, and rewritten as a tracked palette: @t_* only,
# no layout. conf/status.conf supplies the layout, so this file stays small and
# hand-editable.
#
# To make this the default, change the theme line in tmux.conf to:
#   source-file ~/.config/tmux/theme/rivendell.conf

set -g @t_bg       '#151a1e'
set -g @t_bg_dim   '#101417'
set -g @t_bg1      '#273030'
set -g @t_bg2      '#273030'
set -g @t_bg3      '#2e3a38'
set -g @t_bg4      '#35423f'
set -g @t_bg5      '#3d4b47'

set -g @t_bg_red    '#3a2c30'
set -g @t_bg_green  '#2e3a38'
set -g @t_bg_blue   '#28343a'
set -g @t_bg_yellow '#343325'
set -g @t_bg_visual '#273030'

set -g @t_fg       '#D3C6AA'
set -g @t_red      '#E06C75'
set -g @t_orange   '#E69875'
set -g @t_yellow   '#DBBC7F'
set -g @t_green    '#83C092'
set -g @t_aqua     '#7FBBB3'
set -g @t_blue     '#7FBBB3'
set -g @t_purple   '#D699B6'

set -g @t_grey0    '#6B7A72'
set -g @t_grey1    '#6B7A72'
set -g @t_grey2    '#6B7A72'

set -g @t_accent   '#83C092'
set -g @t_warn     '#DBBC7F'
set -g @t_error    '#E06C75'
set -g @t_inactive '#6B7A72'
