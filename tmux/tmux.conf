# tmux entry point.
#
# Load order matters in two places:
#   status.conf reads the palette, so a theme must be sourced before it.
#   theme.conf is sourced AFTER status.conf so a generated theme can override
#   both palette and layout.
#
# Layout:
#   conf/          hand-maintained modules
#   theme/         tracked palettes, one file each
#   theme.conf     generated by ~/.config/rice/apply-theme.sh (gitignored)
#   local.conf     machine-specific (gitignored)
#
# Everything themeable is expressed as @t_* user options, which is the naming
# the rice theme switcher already emits — so a generated theme.conf drops in
# without touching status.conf.

set-environment -g TMUX_CONF_DIR "#{d:current_file}"

source-file ~/.config/tmux/conf/options.conf
source-file ~/.config/tmux/conf/keys.conf
source-file ~/.config/tmux/conf/navigation.conf
source-file ~/.config/tmux/conf/copy.conf

# Default palette. Swap this line to change the tracked default.
source-file ~/.config/tmux/theme/everforest.conf
source-file ~/.config/tmux/conf/status.conf

# Generated theme override, if the rice switcher has run.
source-file -q ~/.config/tmux/theme.conf

# Work tooling: dashboard/worktree popups. Absent on personal machines.
source-file -q ~/.config/shopify-ai-dev/configs/tmux/tmux.conf.snippet

# Machine-specific last, so it wins.
source-file -q ~/.config/tmux/local.conf
